[package]
name = "akhtabooti"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "akhtabooti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Also listed under [dependencies]. Duplicated here so our build script (which
# stages libtika_native for bundling) is forced to run after akhtabooti-core
# and its extractous/GraalVM native build finish — Cargo only orders a build
# script after crates it's actually linked against as a build-dependency, not
# after ordinary dependencies of the final binary.
akhtabooti-core = { git = "https://github.com/wlaith/akhtabooti-core", branch = "main" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
akhtabooti-core = { git = "https://github.com/wlaith/akhtabooti-core", branch = "main" }

