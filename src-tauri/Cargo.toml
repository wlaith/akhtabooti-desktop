[package]
name = "akhtabooti"
version = "0.1.0"
description = "Scans local files and folders for personally identifiable information, entirely offline."
authors = ["Jordan Open Source Association (JOSA)"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wlaith/akhtabooti-desktop"
homepage = "https://github.com/wlaith/akhtabooti-desktop"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "akhtabooti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Also a regular dependency. Duplicated here so Cargo runs our build script
# after extractous' GraalVM build: tauri_build checks the frameworks paths in
# tauri.conf.json exist, so libtika_native must be staged by then, and Cargo
# only orders build scripts after build-dependencies. Costs a file copy, not a
# second GraalVM compile — extractous reuses an already-built library.
akhtabooti-core = { git = "https://github.com/wlaith/akhtabooti-core", branch = "main" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
akhtabooti-core = { git = "https://github.com/wlaith/akhtabooti-core", branch = "main" }

