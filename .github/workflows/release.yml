name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: -- --locked
          - platform: ubuntu-22.04
            args: --bundles deb,rpm -- --locked
          - platform: windows-latest
            args: -- --locked
    runs-on: ${{ matrix.platform }}
    # The GraalVM native-image build of extractous's tika-native takes
    # 30+ minutes on the 3-core / 7 GB macos-latest runner.
    timeout-minutes: ${{ matrix.platform == 'macos-latest' && 120 || 60 }}
    env:
      # extractous's build script inherits this env into native-image. Its
      # deadlock watchdog (10 min of no progress) killed the build on the slow
      # macOS runner while it was still working; the job timeout is the backstop.
      NATIVE_IMAGE_OPTIONS: -H:DeadlockWatchdogInterval=0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      # Build extractous (and its ~5 GB native-image JVM) on its own first.
      # Inside the full tauri build it competes with parallel rustc jobs for
      # 7 GB of RAM, swaps, and stalls. The tauri build then reuses the output.
      - if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: cargo build --release --locked -p extractous

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the bundle falls back to the ad-hoc identity in
          # tauri.conf.json, which Gatekeeper rejects on other machines.
          # Notarization needs the APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID trio;
          # the bundler skips it with a warning when they are absent.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Akhtabooti ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

      # Catches builds that run here but die at launch on any other Mac.
      - if: matrix.platform == 'macos-latest'
        run: sh src-tauri/scripts/verify-macos-bundle.sh

  provenance:
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Collect the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
