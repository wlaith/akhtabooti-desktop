name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach real personal data.** No documents, screenshots or
        exported reports containing anyone's real information. Use synthetic
        examples instead.

        For security vulnerabilities, do not use this form — see
        [SECURITY.md](../blob/development/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a folder containing ...
        2. Start the scan
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Akhtabooti version
      description: Shown in the About dialog
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: File types involved
      description: >
        If the problem involves particular documents, describe their format and
        rough size. Do not upload the files themselves.
